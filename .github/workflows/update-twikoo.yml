name: Update Twikoo

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 UTC 3:00（北京时间 11 点）检查一次
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest twikoo-vercel version
        id: ver
        run: |
          LATEST=$(curl -s https://registry.npmjs.org/twikoo-vercel/latest | jq -r .version)
          CURRENT=$(jq -r '.dependencies["twikoo-vercel"]' package.json)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Commit and push if updated
        if: steps.ver.outputs.latest != steps.ver.outputs.current
        run: |
          jq --arg v "${{ steps.ver.outputs.latest }}" \
             '.dependencies["twikoo-vercel"]=$v' package.json > tmp && mv tmp package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update twikoo-vercel to ${{ steps.ver.outputs.latest }}"
          git push
