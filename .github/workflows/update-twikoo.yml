name: Update Twikoo

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 UTC 3:00（北京时间 11 点）检查一次
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  workflows: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check updates and bump versions
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          F=.github/workflows/update-twikoo.yml

          # Twikoo 云函数版本（校验格式，API 失败时不写坏 package.json）
          TWIKOO_LATEST=$(curl -s https://registry.npmjs.org/twikoo-vercel/latest | jq -r .version)
          case "$TWIKOO_LATEST" in
            ''|*[!0-9.]*) echo "::warning::获取 twikoo-vercel 版本失败（$TWIKOO_LATEST），跳过更新"; TWIKOO_LATEST="" ;;
          esac
          TWIKOO_CURRENT=$(jq -r '.dependencies["twikoo-vercel"]' package.json)
          if [ -n "$TWIKOO_LATEST" ] && [ "$TWIKOO_LATEST" != "$TWIKOO_CURRENT" ]; then
            jq --arg v "$TWIKOO_LATEST" '.dependencies["twikoo-vercel"]=$v' package.json > tmp && mv tmp package.json
            echo "twikoo_updated=true" >> "$GITHUB_OUTPUT"
          fi

          # 本工作流用到的官方 Actions 主版本（releases/latest 不含预发布版本）
          for repo in checkout setup-node; do
            # 带认证调用 GitHub API，避开 runner 共享 IP 的未认证限流（60次/小时/IP）
            LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/actions/$repo/releases/latest" | jq -r .tag_name | cut -d. -f1)
            # 格式校验：限流/网络故障时 jq 解析出 null，此时跳过而不是写坏本文件
            case "$LATEST" in
              v[0-9]*) ;;
              *) echo "::warning::获取 actions/$repo 最新版本失败（$LATEST），跳过自更新"; continue ;;
            esac
            CURRENT=$(grep -oE "actions/$repo@v[0-9]+" "$F" | head -1 | cut -d@ -f2)
            if [ "$LATEST" != "$CURRENT" ]; then
              sed -i "s|actions/$repo@v[0-9]*|actions/$repo@$LATEST|g" "$F"
              echo "actions_updated=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Commit and push
        if: steps.bump.outputs.twikoo_updated == 'true' || steps.bump.outputs.actions_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          V=$(jq -r '.dependencies["twikoo-vercel"]' package.json)
          # [skip ci] 让 Vercel 的 Git 集成跳过这次 push，部署改由下一步用 CLI 上传
          git commit -m "chore: twikoo-vercel $V; sync action versions [skip ci]"
          git push

      - uses: actions/setup-node@v7
        if: steps.bump.outputs.twikoo_updated == 'true'
        with:
          node-version: 20

      # 构建在 GitHub runner 上完成，Vercel 只接收现成产物，不执行构建
      - name: Build and deploy to Vercel
        if: steps.bump.outputs.twikoo_updated == 'true'
        env:
          VERCEL_TWIKOO_TOKEN: ${{ secrets.VERCEL_TWIKOO_TOKEN }}
        run: |
          # 去除粘贴时可能混入的空白字符（GitHub 不会自动裁剪 secret）
          VERCEL_TWIKOO_TOKEN="$(printf '%s' "$VERCEL_TWIKOO_TOKEN" | tr -d '[:space:]')"
          echo "token length: ${#VERCEL_TWIKOO_TOKEN}"
          npm i -g vercel@latest
          vercel link --yes --project=blogcmts --token "$VERCEL_TWIKOO_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TWIKOO_TOKEN"
          vercel build --prod --token "$VERCEL_TWIKOO_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TWIKOO_TOKEN"
